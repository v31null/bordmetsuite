<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        #map {
            height: calc(100vh - 5rem); 
            z-index: 10;
        }
        
        input[type="file"]::file-selector-button {
            border-radius: 4px;
            padding: 0 16px;
            height: 40px;
            cursor: pointer;
            background-color: #3b82f6;
            border: 1px solid rgba(0, 0, 0, 0.16);
            box-shadow: 0px 1px 0px rgba(0, 0, 0, 0.05);
            margin-right: 16px;
            transition: background-color 200ms;
            color: white;
            font-weight: 600;
        }
        input[type="file"]::file-selector-button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans overflow-hidden flex flex-col h-screen">

    <header class="bg-white border-b border-slate-200 h-20 flex items-center justify-between px-6 shadow-sm shrink-0">
        <div>
            <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                BORDMET Checker.
            </h1>
        </div>
        
        <div class="flex items-center gap-4">
            <div id="error-message" class="text-red-500 text-sm font-medium hidden"></div>
            <a href="land.html"><button class="tab" data-t="checker">BORDMET </button></a>
            <label class="block">
                <span class="sr-only">Choose JSON file</span>
                <input type="file" id="json-upload" accept=".json" class="block w-full text-sm text-slate-500
                    file:mr-4 file:py-2 file:px-4
                    file:rounded-full file:border-0
                    file:text-sm file:font-semibold
                    file:bg-blue-50 file:text-blue-700
                    hover:file:bg-blue-100
                    cursor-pointer
                "/>
            </label>
        </div>
    </header>

    <div class="relative flex-grow">
        <div id="loading-overlay" class="absolute inset-0 bg-white/80 z-[1000] hidden flex-col items-center justify-center backdrop-blur-sm">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
        </div>
        
        <div id="map" class="w-full h-full bg-slate-200"></div>
    </div>

    <script>
        const map = L.map('map', { 
            preferCanvas: true
        }).setView([35.6764, 139.6500], 5);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);

        const fileInput = document.getElementById('json-upload');
        const errorMessage = document.getElementById('error-message');
        const loadingOverlay = document.getElementById('loading-overlay');

        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    errorMessage.classList.add('hidden');
                    
                    loadingOverlay.classList.remove('hidden');
                    loadingOverlay.classList.add('flex');
                    
                    setTimeout(() => {
                        processData(data);
                    }, 50);

                } catch (error) {
                    console.error("JSON parsing error:", error);
                    showError("Invalid JSON file. Please check your format.");
                }
            };

            reader.readAsText(file);
        });

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.remove('hidden');
            loadingOverlay.classList.add('hidden');
            loadingOverlay.classList.remove('flex');
        }

        function processData(data) {
            markersLayer.clearLayers();

            if (!Array.isArray(data) || data.length === 0) {
                showError("JSON must be a non-empty array of locations.");
                return;
            }

            let minLat = Infinity, maxLat = -Infinity;
            let minLon = Infinity, maxLon = -Infinity;

            data.forEach((item) => {
                if (!item.coordinates || item.coordinates.length !== 2) return;

                const lat = item.coordinates[0];
                const lon = item.coordinates[1];

                if (lat < minLat) minLat = lat;
                if (lat > maxLat) maxLat = lat;
                if (lon < minLon) minLon = lon;
                if (lon > maxLon) maxLon = lon;

                const marker = L.circleMarker([lat, lon], {
                    radius: 3,
                    fillColor: "#ef4444",
                    color: "#b91c1c",
                    weight: 1,
                    opacity: 0.8,
                    fillOpacity: 0.6
                });
                
                marker.bindPopup(`
                    <div class="p-1">
                        <h3 class="font-bold text-lg mb-1">${item.name || 'Unnamed'}</h3>
                        <div class="text-sm text-slate-600">
                            <p><span class="font-semibold text-slate-700">Place:</span> ${item.place || 'N/A'}</p>
                            <p><span class="font-semibold text-slate-700">Rank:</span> ${item.rank || 'N/A'}</p>
                        </div>
                    </div>
                `);

                markersLayer.addLayer(marker);
            });

            if (minLat !== Infinity) {
                map.fitBounds([
                    [minLat, minLon],
                    [maxLat, maxLon]
                ], { padding: [50, 50] });
            } else {
                showError("No valid coordinates found in the JSON file.");
            }
            
            loadingOverlay.classList.add('hidden');
            loadingOverlay.classList.remove('flex');
            
            fileInput.value = '';
        }

        window.addEventListener('resize', () => {
            map.invalidateSize();
        });
    </script>
</body>
</html>
